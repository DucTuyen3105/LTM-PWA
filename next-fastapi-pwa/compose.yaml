services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U todo -d todo']
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://todo:todo@db:5432/todo
      WATCHFILES_FORCE_POLLING: 'true'
    ports:
      - '127.0.0.1:8000:8000'
      - '127.0.0.1:5678:5678'
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
